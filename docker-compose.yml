services:

  web-alpiplan:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://alpiplan:${POSTGRES_PASSWORD:-alpiplan_dev_change_me}@postgres-alpiplan:5432/alpiplan?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-16-chars}
      REDIS_URL: redis://redis-alpiplan:6379
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      APP_URL: ${APP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
    ports:
      - "3000:3000"
    networks:
      - alpiplan-network

  worker-alpiplan:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://alpiplan:${POSTGRES_PASSWORD:-alpiplan_dev_change_me}@postgres-alpiplan:5432/alpiplan?schema=public
      REDIS_URL: redis://redis-alpiplan:6379
    profiles:
      - worker
    networks:
      - alpiplan-network

networks:
  alpiplan-network:
    name: alpiplan-network
    external: true
